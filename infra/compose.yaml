name: spherex

x-runtime: &runtime
  image: node:24-bookworm-slim
  restart: unless-stopped
  init: true
  user: "1000:1000"
  read_only: true
  working_dir: /app
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  networks: [web]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *runtime
    command: ["node", "--env-file=/run/spherex-api.env", "--env-file=/app/.release.env", "backend/dist/api/server.js"]
    volumes:
      - ${SPHEREX_API_RELEASE_DIR:-/opt/docker/spherex/current-api}:/app:ro
      - /opt/docker/spherex/api.env:/run/spherex-api.env:ro
      # Exportações do laboratório (alvos pré-mapeados), só leitura: /api/catalogo.
      - /opt/docker/spherex/lab/exports:/catalog:ro
    environment:
      NODE_ENV: production
      PORT: "3000"
      SPHEREX_CATALOG_DIR: /catalog
      FRONTEND_ORIGIN: https://${FRONTEND_DOMAIN:-spherex.prospectordigital.com.br}
      # Tem precedência sobre api.env: o serviço Python só é alcançável pela rede interna.
      PYTHON_API_URL: http://spherex-python:8000
    networks: [web, internal]
    healthcheck:
      test: ["CMD", "node", "--env-file=/app/.release.env", "-e", "fetch('http://127.0.0.1:3000/healthz').then(async r=>{if(!r.ok||(await r.json()).version!==process.env.GIT_SHA)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.spherex-api.rule: Host(`${API_DOMAIN:-api.spherex.prospectordigital.com.br}`)
      traefik.http.routers.spherex-api.entrypoints: websecure
      traefik.http.routers.spherex-api.tls: "true"
      traefik.http.routers.spherex-api.tls.certresolver: lets-encrypt
      traefik.http.routers.spherex-api.service: spherex-api
      traefik.http.services.spherex-api.loadbalancer.server.port: "3000"

  frontend:
    <<: *runtime
    command: ["node", "--env-file=/app/.release.env", "frontend/server.mjs"]
    volumes:
      - ${SPHEREX_FRONTEND_RELEASE_DIR:-/opt/docker/spherex/current-frontend}:/app:ro
    environment:
      NODE_ENV: production
      PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "--env-file=/app/.release.env", "-e", "fetch('http://127.0.0.1:8080/healthz').then(async r=>{if(!r.ok||(await r.json()).version!==process.env.GIT_SHA)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.spherex-frontend.rule: Host(`${FRONTEND_DOMAIN:-spherex.prospectordigital.com.br}`)
      traefik.http.routers.spherex-frontend.entrypoints: websecure
      traefik.http.routers.spherex-frontend.tls: "true"
      traefik.http.routers.spherex-frontend.tls.certresolver: lets-encrypt
      traefik.http.routers.spherex-frontend.service: spherex-frontend
      traefik.http.services.spherex-frontend.loadbalancer.server.port: "8080"

  python:
    <<: *runtime
    image: python:3.12-slim-bookworm
    # Sem labels do Traefik: o serviço não é publicado; só a API Node o acessa.
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /app/backend
    volumes:
      - ${SPHEREX_PYTHON_RELEASE_DIR:-/opt/docker/spherex/current-python}:/app:ro
      - /opt/docker/spherex/cache:/cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SPHEREX_CACHE_DIR: /cache/temporal
      SPHEREX_RELEASE_ENV: /app/.release.env
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    networks:
      internal:
        aliases: [spherex-python]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,urllib.request;v=dict(l.strip().split('=',1) for l in open('/app/.release.env') if '=' in l)['GIT_SHA'];r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2));raise SystemExit(r.get('version')!=v)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  # Laboratório de mapeamento (dev/temporal-lab): interface própria, autenticação
  # HTTP Basic gerada no primeiro start (/opt/docker/spherex/lab/CREDENTIALS.txt).
  # Cada versão do motor roda como subprocesso em 127.0.0.1 dentro deste container.
  lab:
    <<: *runtime
    image: python:3.12-slim-bookworm
    command: ["/app/.venv/bin/python", "dev/temporal-lab/server.py", "--host", "0.0.0.0", "--port", "8765"]
    working_dir: /app
    volumes:
      - ${SPHEREX_LAB_RELEASE_DIR:-/opt/docker/spherex/current-lab}:/app:ro
      - /opt/docker/spherex/lab:/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SPHEREX_LAB_DATA_DIR: /data
      SPHEREX_LAB_AUTH: required
      SPHEREX_RELEASE_ENV: /app/.release.env
    pids_limit: 512
    mem_limit: 3g
    # VPS com 2 CPUs compartilhadas: o mapeamento é mais rede que CPU.
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,urllib.request;v=dict(l.strip().split('=',1) for l in open('/app/.release.env') if '=' in l)['GIT_SHA'];r=json.load(urllib.request.urlopen('http://127.0.0.1:8765/api/health?light=1',timeout=2));raise SystemExit(r.get('version')!=v)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: web
      traefik.http.routers.spherex-lab.rule: Host(`${LAB_DOMAIN:-lab.spherex.prospectordigital.com.br}`)
      traefik.http.routers.spherex-lab.entrypoints: websecure
      traefik.http.routers.spherex-lab.tls: "true"
      traefik.http.routers.spherex-lab.tls.certresolver: lets-encrypt
      traefik.http.routers.spherex-lab.service: spherex-lab
      traefik.http.services.spherex-lab.loadbalancer.server.port: "8765"

networks:
  web:
    external: true
  # Rede privada do projeto (Node <-> Python). Mantém saída para a internet (IRSA).
  internal: {}
