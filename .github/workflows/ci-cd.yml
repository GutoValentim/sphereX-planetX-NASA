name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      lab: ${{ steps.filter.outputs.lab }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          backend=false
          python=false
          frontend=false
          infra=false
          lab=false
          ci=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            backend=true
            python=true
            frontend=true
            infra=true
            lab=true
            ci=true
          elif [[ "$EVENT_NAME" == push || "$EVENT_NAME" == pull_request ]]; then
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              if [[ "$EVENT_NAME" == pull_request && -n "$BASE_SHA" ]]; then
                changed_files=$(git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA")
              else
                changed_files=$(git ls-tree -r --name-only "$GITHUB_SHA")
              fi
            else
              changed_files=$(git diff --no-renames --name-only "$BEFORE" "$GITHUB_SHA")
            fi
            while IFS= read -r file; do
              case "$file" in
                # Mesma classificação usada por infra/deploy.sh.
                # O laboratório congela o backend Python em versões do motor.
                backend/*.py|backend/requirements*.txt)
                  python=true
                  lab=true
                  ;;
                dev/temporal-lab/*) lab=true ;;
                backend/*) backend=true ;;
                frontend/*) frontend=true ;;
                infra/*) infra=true ;;
                .github/workflows/*) ci=true ;;
                package.json|package-lock.json|eslint.config.mjs)
                  backend=true
                  frontend=true
                  ;;
              esac
            done <<< "$changed_files"
          fi
          {
            echo "backend=$backend"
            echo "python=$python"
            echo "frontend=$frontend"
            echo "infra=$infra"
            echo "lab=$lab"
            echo "ci=$ci"
          } >> "$GITHUB_OUTPUT"

  backend-ci:
    name: Backend validation
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx eslint backend
      - run: npx tsc --noEmit -p backend/tsconfig.json
      - run: npx tsx --test backend/tests/*.test.ts
      - run: npx tsc -p backend/tsconfig.json

  python-ci:
    name: Python validation
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend-ci:
    name: Frontend validation
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx eslint frontend
      - run: npm run typecheck --workspace frontend
      - run: node --test frontend/tests/*.test.mjs
      - run: npm run build --workspace frontend

  lab-ci:
    name: Lab validation
    needs: changes
    if: needs.changes.outputs.lab == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: npx eslint dev
      - run: node --test dev/temporal-lab/tests/*.test.mjs
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s dev/temporal-lab/tests -p 'test_*.py' -v
      - name: Smoke test (gateway + engine v1)
        run: |
          data=$(mktemp -d)
          SPHEREX_LAB_DATA_DIR="$data" SPHEREX_LAB_AUTH=required python dev/temporal-lab/server.py --port 8765 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 1 90); do curl -sf 'http://127.0.0.1:8765/api/health?light=1' >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 401
          user=$(sed -n 's/^usuário: //p' "$data/CREDENTIALS.txt")
          pass=$(sed -n 's/^senha: //p' "$data/CREDENTIALS.txt")
          curl -sf -u "$user:$pass" http://127.0.0.1:8765/api/health | python -c 'import json,sys; d=json.load(sys.stdin); assert d["default_engine"] == "v1" and d["settings"], d'
          curl -sf -u "$user:$pass" http://127.0.0.1:8765/ | grep -q 'SPHEREx Lab'

  infra-ci:
    name: Infrastructure validation
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: bash -n infra/deploy.sh && bash -n infra/ssh-deploy.sh
      - run: python -m unittest discover -s infra/tests -v

  deploy-api:
    name: Deploy API
    needs: [backend-ci, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: spherex-api-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SPHEREX_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Configure SPHEREX_SSH_PRIVATE_KEY in repository secrets."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spherex
          chmod 600 ~/.ssh/spherex
          install -m 600 infra/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/spherex -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            spherex-deploy@150.230.73.212 "deploy $DEPLOY_SHA api"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/spherex

  deploy-python:
    name: Deploy Python
    needs: [python-ci, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.python == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: spherex-python-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SPHEREX_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Configure SPHEREX_SSH_PRIVATE_KEY in repository secrets."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spherex
          chmod 600 ~/.ssh/spherex
          install -m 600 infra/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/spherex -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            spherex-deploy@150.230.73.212 "deploy $DEPLOY_SHA python"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/spherex

  deploy-lab:
    name: Deploy lab
    needs: [lab-ci, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.lab == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: spherex-lab-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SPHEREX_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Configure SPHEREX_SSH_PRIVATE_KEY in repository secrets."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spherex
          chmod 600 ~/.ssh/spherex
          install -m 600 infra/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/spherex -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            spherex-deploy@150.230.73.212 "deploy $DEPLOY_SHA lab"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/spherex

  deploy-frontend:
    name: Deploy frontend
    needs: [frontend-ci, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.frontend == 'true' && needs.changes.outputs.infra != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: spherex-frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SPHEREX_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Configure SPHEREX_SSH_PRIVATE_KEY in repository secrets."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spherex
          chmod 600 ~/.ssh/spherex
          install -m 600 infra/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/spherex -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            spherex-deploy@150.230.73.212 "deploy $DEPLOY_SHA frontend"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/spherex

  deploy-stack:
    name: Deploy full stack
    needs: [backend-ci, python-ci, frontend-ci, lab-ci, infra-ci, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: spherex-stack-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.SPHEREX_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "::error::Configure SPHEREX_SSH_PRIVATE_KEY in repository secrets."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/spherex
          chmod 600 ~/.ssh/spherex
          install -m 600 infra/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy the tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/spherex -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            spherex-deploy@150.230.73.212 "deploy $DEPLOY_SHA stack"
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/spherex
