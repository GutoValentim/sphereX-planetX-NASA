<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sky Explorer — explore SPHEREx astronomical observations by celestial coordinates and date."
    />
    <title>SPHEREx - Sky and Time Explorer</title>
    <script>
      // Applies the theme before React mounts to avoid a flash of the wrong theme.
      // The storage key must match THEME_STORAGE_KEY in src/utils/themePreference.ts.
      (function () {
        try {
          var stored = localStorage.getItem('sky-explorer-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // 'system' or a missing value follows the OS color scheme.
          var theme = 'light';
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (prefersDark) {
            theme = 'dark';
          }
          document.documentElement.dataset.theme = theme;
        } catch {
          // localStorage throws when storage is blocked. Light is applied so the page still paints.
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
